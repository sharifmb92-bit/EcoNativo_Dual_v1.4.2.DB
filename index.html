<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Eco Nativo Dual_v 1.4.2</title>
    
    <meta property="og:title" content="Eco Nativo Dual_v 1.4.2">
    <meta property="og:description" content="Traductor Universal Profesional y Módulo de Aprendizaje.">
    <meta property="og:image" content="icon-512.png">
    <meta property="og:type" content="website">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-me: #1e1e1e;
            --bg-client: #ffffff;
            --c-idle: #ea4335;
            --c-me: #ff7a00; 
            --c-client: #34a853;
            --txt-me: #ffffff;
            --txt-client: #333333;
        }

        body.high-contrast {
            --bg-me: #000000;
            --bg-client: #111111;
            --txt-me: #ffff00;
            --txt-client: #00ffff;
        }

        body.mode-driver #part-client {
            height: 35dvh;
            transform: none;
            border-bottom: 2px solid var(--c-me);
        }
        body.mode-driver #part-me {
            height: 65dvh;
        }
        body.mode-driver .client-text {
            font-size: 32px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body, html { 
            height: 100dvh; overflow: hidden; 
            background-color: #000;
            display: flex; flex-direction: column;
            user-select: none;
        }

        #splash {
            position: fixed; inset: 0; background: #1e1e1e; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 3000; transition: opacity 0.5s ease;
        }
        #splash.hidden { opacity: 0; pointer-events: none; }

        .perm-btn {
            margin-top: 20px; padding: 14px 28px; background: var(--c-me);
            color: white; border: none; border-radius: 25px; font-weight: bold;
            font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.4);
        }

        #part-client {
            height: 50dvh; background-color: var(--bg-client);
            transform: rotate(180deg); display: flex; flex-direction: column;
            padding: 20px 30px; justify-content: center; align-items: center;
            position: relative; border-bottom: 1px solid #ddd;
            cursor: pointer; transition: all 0.3s ease;
        }

        #part-me {
            height: 50dvh; background-color: var(--bg-me); color: var(--txt-me);
            display: flex; flex-direction: column; padding: 30px;
            justify-content: center; align-items: center; position: relative;
            cursor: pointer; transition: all 0.3s ease;
        }

        .lang-label {
            font-size: 16px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; color: var(--c-me); margin-bottom: 15px;
            text-align: center;
        }

        .text-display {
            font-size: 26px; font-weight: 700; text-align: center;
            width: 100%; line-height: 1.3; min-height: 1.3em;
            max-height: 60%; overflow-y: auto; padding: 0 10px;
        }
        .client-text { color: var(--txt-client); }
        .me-text { color: var(--txt-me); }
        .interim { opacity: 0.5; font-weight: 400; font-style: italic; }

        .controls {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 500; 
            pointer-events: none; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .mic-wrapper {
            position: absolute; pointer-events: auto;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mic-btn {
            width: 90px; height: 90px; border-radius: 50%;
            border: 6px solid #000; background: var(--c-idle); 
            color: white; font-size: 38px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }

        .controls.pos-me .mic-wrapper { transform: translateY(80px); }
        .controls.pos-client .mic-wrapper { transform: translateY(-130px); } 

        .mode-me .mic-btn { background: var(--c-me); box-shadow: 0 0 30px var(--c-me); }
        
        .mode-client .mic-btn { 
            background: var(--c-client); 
            transform: scale(1.1);
            animation: pulse-green-glow 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulse-green-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(52, 168, 83, 0.6); }
            50% { box-shadow: 0 0 45px rgba(52, 168, 83, 0.9), 0 0 0 15px rgba(52, 168, 83, 0%); }
        }

        .flags {
            position: absolute; 
            top: calc(15px + env(safe-area-inset-top)); 
            display: flex; gap: 15px; z-index: 600;
        }
        .flag-btn {
            font-size: 26px; background: rgba(0,0,0,0.05); 
            border: 2px solid transparent; border-radius: 50%; 
            width: 55px; height: 55px; display: flex; 
            align-items: center; justify-content: center; 
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .flag-btn.active { border-color: var(--c-me); background: rgba(0,0,0,0.1); transform: scale(1.1); }

        .top-tools {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 700;
        }
        .tool-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer;
        }

        /* Botón Estrella para Aprendizaje */
        .star-save-btn {
            display: none;
            margin-top: 10px; background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700; color: #ffd700;
            padding: 6px 14px; border-radius: 20px; font-size: 14px;
            font-weight: bold; cursor: pointer; transition: all 0.2s ease;
        }
        .star-save-btn.active { display: inline-block; }

        /* Modales */
        .custom-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 4000; display: flex; flex-direction: column; padding: 20px;
            color: white; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .custom-modal.active { opacity: 1; pointer-events: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-list { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .card-item { 
            background: #222; padding: 14px; border-radius: 10px; margin-bottom: 12px; 
            font-size: 18px; line-height: 1.4; border-left: 5px solid var(--c-me);
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-body { flex: 1; padding-right: 10px; }
        .card-sub { font-size: 14px; color: #34a853; margin-top: 4px; font-weight: bold; }
        .action-icon-btn {
            background: #333; border: 1px solid #555; color: white;
            width: 40px; height: 40px; border-radius: 50%; font-size: 18px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div style="font-size: 60px; margin-bottom: 20px;">🗣️</div>
        <h2 style="letter-spacing: 4px; font-weight: 300;">ECO NATIVO DUAL 1.4.2</h2>
        <p style="font-size: 10px; margin-top: 10px; opacity: 0.5; letter-spacing: 2px;">UNIVERSAL TRANSLATOR ENGINE</p>
        <button class="perm-btn" onclick="startAppDirectly()">INICIAR APLICACIÓN</button>
    </div>

    <div id="part-client" onclick="startTurnFromArea('client')">
        <div class="flags" id="flags-container"></div>
        <div class="text-display client-text" id="text-client">...</div>
    </div>

    <div class="controls" id="control-zone">
        <div class="mic-wrapper">
            <button class="mic-btn" id="main-mic" onclick="handleCentralButton(event)">🎙️</button>
        </div>
    </div>

    <div id="part-me" onclick="startTurnFromArea('me')">
        <div class="lang-label" id="label-client">...</div>
        <div class="text-display me-text" id="text-me">...</div>
        <button class="star-save-btn" id="save-phrase-btn" onclick="saveCurrentPhrase(event)">⭐ Guardar para aprender</button>
        
        <div class="top-tools">
            <button class="tool-btn" id="mode-btn" title="Cambiar Vista Conductor/Mostrador" onclick="toggleDisplayMode(event)">🚌</button>
            <button class="tool-btn" title="Modo Sol" onclick="toggleContrast(event)">☀️</button>
            <button class="tool-btn" title="Mis Frases para Aprender" onclick="openStudyModal(event)">🎓</button>
            <button class="tool-btn" title="Notas del Usuario" onclick="openNotesModal(event)">📝</button>
        </div>
    </div>

    <!-- Modal de Notas -->
    <div class="custom-modal" id="notes-modal">
        <div class="modal-header">
            <h3>📝 Notas e Historial del Usuario</h3>
            <button class="action-icon-btn" onclick="closeNotesModal()">✕</button>
        </div>
        <div class="modal-list" id="notes-container"></div>
        <button class="perm-btn" style="margin-top:0;" onclick="closeNotesModal()">Cerrar</button>
    </div>

    <!-- Modal de Aprendizaje -->
    <div class="custom-modal" id="study-modal">
        <div class="modal-header">
            <h3>🎓 Frases Guardadas para Aprender</h3>
            <button class="action-icon-btn" onclick="closeStudyModal()">✕</button>
        </div>
        <div class="modal-list" id="study-container"></div>
        <button class="perm-btn" style="margin-top:0;" onclick="closeStudyModal()">Cerrar</button>
    </div>

    <script>
        // medbasha - adaptive local acoustic unifier & indexeddb persistence engine
        if ('serviceWorker' in navigator) { 
            navigator.serviceWorker.register('./sw.js'); 
        }

        let db;
        let userLang = 'es'; 
        let targetLang = 'en';
        let isRunning = false;
        let isSpeakingNow = false; 
        let currentTurn = 'idle'; 
        let recognition = null;
        let hardwareWatchdogTimer;
        let lastTranslationData = null;

        const langCodes = { 'es': 'es-ES', 'en': 'en-US', 'fr': 'fr-FR', 'de': 'de-DE', 'it': 'it-IT' };
        const langNames = {
            'es': { 'es': 'Español', 'en': 'Spanish', 'fr': 'Espagnol', 'de': 'Spanisch', 'it': 'Spagnolo' },
            'en': { 'es': 'Inglés', 'en': 'English', 'fr': 'Anglais', 'de': 'Englisch', 'it': 'Inglese' },
            'fr': { 'es': 'Francés', 'en': 'French', 'fr': 'Français', 'de': 'Französisch', 'it': 'Francese' },
            'de': { 'es': 'Alemán', 'en': 'German', 'fr': 'Allemand', 'de': 'Deutsch', 'it': 'Tedesco' },
            'it': { 'es': 'Italiano', 'en': 'Italian', 'fr': 'Italien', 'de': 'Italienisch', 'it': 'Italiano' }
        };

        const actionMsgs = {
            'es': 'Toca tu zona o el botón para hablar',
            'en': 'Tap your zone or button to speak',
            'fr': 'Touchez votre zone pour parler',
            'de': 'Tippen Sie zum Sprechen',
            'it': 'Tocca la tua zona per parlare'
        };

        const fallbackMsgs = {
            'es': 'Lo siento, no he entendido. Vuelve a pulsar.',
            'en': 'I am sorry, I did not understand. Tap again.',
            'fr': 'Désolé, je n\'ai pas compris. Appuyez à nouveau.',
            'de': 'Entschuldigung, das habe ich nicht verstanden.',
            'it': 'Mi dispiace, non ho capito. Tocca di nuevo.'
        };

        const courtesyDictionary = {
            'buenos dias': { 'es': 'Buenos días', 'en': 'Good morning', 'fr': 'Bonjour', 'de': 'Guten Morgen', 'it': 'Buongiorno' },
            'buenos días': { 'es': 'Buenos días', 'en': 'Good morning', 'fr': 'Bonjour', 'de': 'Guten Morgen', 'it': 'Buongiorno' },
            'buenas tardes': { 'es': 'Buenas tardes', 'en': 'Good afternoon', 'fr': 'Bonsoir', 'de': 'Guten Tag', 'it': 'Buon pomeriggio' },
            'buenas noches': { 'es': 'Buenas noches', 'en': 'Good evening', 'fr': 'Bonne nuit', 'de': 'Gute Nacht', 'it': 'Buona notte' },
            'gracias': { 'es': 'Gracias', 'en': 'Thank you', 'fr': 'Merci', 'de': 'Danke', 'it': 'Grazie' },
            'muchas gracias': { 'es': 'Muchas gracias', 'en': 'Thank you very much', 'fr': 'Merci beaucoup', 'de': 'Vielen Dank', 'it': 'Mille grazie' },
            'por favor': { 'es': 'Por favor', 'en': 'Please', 'fr': "S'il vous plaît", 'de': 'Bitte', 'it': 'Per favore' },
            'de nada': { 'es': 'De nada', 'en': "You're welcome", 'fr': 'De rien', 'de': 'Bitte sehr', 'it': 'Prego' },
            'hola': { 'es': 'Hola', 'en': 'Hello', 'fr': 'Bonjour', 'de': 'Hallo', 'it': 'Ciao' },
            'adios': { 'es': 'Adiós', 'en': 'Goodbye', 'fr': 'Au revoir', 'de': 'Auf Wiedersehen', 'it': 'Arrivederci' },
            'adiós': { 'es': 'Adiós', 'en': 'Goodbye', 'fr': 'Au revoir', 'de': 'Auf Wiedersehen', 'it': 'Arrivederci' },
            'hasta luego': { 'es': 'Hasta luego', 'en': 'See you later', 'fr': 'À plus tard', 'de': 'Bis später', 'it': 'A dopo' }
        };

        window.onload = () => {
            initIndexedDB();
            detectDeviceLanguage();
            setupFlagsStructure();
            resetToIdleMessage();
        };

        function requestStoragePersistence() {
            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist();
            }
        }

        function initIndexedDB() {
            requestStoragePersistence();
            const request = indexedDB.open("EcoNativoDualDB", 3);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("appState")) {
                    db.createObjectStore("appState", { keyPath: "id" });
                }
                if (!db.objectStoreNames.contains("incidencias")) {
                    db.createObjectStore("incidencias", { keyPath: "id", autoIncrement: true });
                }
                if (!db.objectStoreNames.contains("aprendizaje")) {
                    db.createObjectStore("aprendizaje", { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = (e) => { db = e.target.result; };
            request.onerror = (e) => { console.error("IndexedDB error", e); };
        }

        function startAppDirectly() {
            document.getElementById('splash').classList.add('hidden');
        }

        function toggleDisplayMode(e) {
            e.stopPropagation();
            document.body.classList.toggle('mode-driver');
            const btn = document.getElementById('mode-btn');
            btn.innerText = document.body.classList.contains('mode-driver') ? '🏢' : '🚌';
        }

        function toggleContrast(e) {
            e.stopPropagation();
            document.body.classList.toggle('high-contrast');
        }

        function saveNote(text) {
            if (!db || !text || text.length < 3) return;
            const tx = db.transaction("incidencias", "readwrite");
            const store = tx.objectStore("incidencias");
            store.add({ text: text, date: new Date().toLocaleString() });
        }

        function saveCurrentPhrase(e) {
            e.stopPropagation();
            if (!db || !lastTranslationData) return;
            const tx = db.transaction("aprendizaje", "readwrite");
            const store = tx.objectStore("aprendizaje");
            store.add({
                original: lastTranslationData.original,
                translated: lastTranslationData.translated,
                targetLang: lastTranslationData.targetLang,
                date: new Date().toLocaleDateString()
            });
            document.getElementById('save-phrase-btn').classList.remove('active');
            alert("¡Frase guardada en tu cuaderno de aprendizaje! 🎓");
        }

        function openStudyModal(e) {
            e.stopPropagation();
            if (!db) return;
            const container = document.getElementById('study-container');
            container.innerHTML = 'Cargando...';
            
            const tx = db.transaction("aprendizaje", "readonly");
            const store = tx.objectStore("aprendizaje");
            const req = store.getAll();

            req.onsuccess = () => {
                const items = req.result;
                if (items.length === 0) {
                    container.innerHTML = '<p style="color:#aaa; text-align:center; padding:20px;">No tienes frases guardadas para aprender aún.</p>';
                } else {
                    container.innerHTML = items.reverse().map(item => `
                        <div class="card-item">
                            <div class="card-body">
                                <div style="font-size:16px;">${item.original}</div>
                                <div class="card-sub">👉 ${item.translated}</div>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button class="action-icon-btn" title="Escuchar" onclick="speakText('${item.translated.replace(/'/g, "\\'")}', '${langCodes[item.targetLang]}')">🔊</button>
                                <button class="action-icon-btn" style="color:#ff5555;" title="Borrar" onclick="deleteStudyPhrase(${item.id})">🗑️</button>
                            </div>
                        </div>
                    `).join('');
                }
                document.getElementById('study-modal').classList.add('active');
            };
        }

        function deleteStudyPhrase(id) {
            if (!db) return;
            const tx = db.transaction("aprendizaje", "readwrite");
            const store = tx.objectStore("aprendizaje");
            store.delete(id);
            tx.oncomplete = () => { openStudyModal(new Event('dummy')); };
        }

        function speakText(text, langCode) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = langCode;
            u.rate = 0.85;
            window.speechSynthesis.speak(u);
        }

        function closeStudyModal() {
            document.getElementById('study-modal').classList.remove('active');
        }

        function openNotesModal(e) {
            e.stopPropagation();
            if (!db) return;
            const container = document.getElementById('notes-container');
            container.innerHTML = 'Cargando...';
            
            const tx = db.transaction("incidencias", "readonly");
            const store = tx.objectStore("incidencias");
            const req = store.getAll();

            req.onsuccess = () => {
                const items = req.result;
                if (items.length === 0) {
                    container.innerHTML = '<p style="color:#aaa;">No hay notas guardadas.</p>';
                } else {
                    container.innerHTML = items.reverse().map(item => `
                        <div class="card-item">
                            <div class="card-body">
                                <div>${item.text}</div>
                                <div style="font-size:10px; color:#888; margin-top:4px;">${item.date}</div>
                            </div>
                        </div>
                    `).join('');
                }
                document.getElementById('notes-modal').classList.add('active');
            };
        }

        function closeNotesModal() {
            document.getElementById('notes-modal').classList.remove('active');
        }

        function detectDeviceLanguage() {
            const sysLang = navigator.language || navigator.userLanguage;
            const shortLang = sysLang.substring(0, 2).toLowerCase();
            if (['en', 'fr', 'de', 'it'].includes(shortLang)) {
                userLang = shortLang;
                targetLang = 'es';
            } else {
                userLang = 'es';
                targetLang = 'en';
            }
        }

        function setupFlagsStructure() {
            const container = document.getElementById('flags-container');
            container.innerHTML = '';
            const allOptions = ['en', 'fr', 'de', 'it', 'es'];
            const flagIcons = { 'en': '🇬🇧', 'fr': '🇫🇷', 'de': '🇩🇪', 'it': '🇮🇹', 'es': '🇪🇸' };
            const availableTargets = allOptions.filter(l => l !== userLang);

            availableTargets.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = `flag-btn ${lang === targetLang ? 'active' : ''}`;
                btn.innerText = flagIcons[lang];
                btn.onclick = (e) => {
                    e.stopPropagation();
                    setLang(lang, langNames[lang][userLang]);
                };
                container.appendChild(btn);
            });
            document.getElementById('label-client').innerText = langNames[targetLang][userLang].toUpperCase();
        }

        function resetToIdleMessage() {
            document.getElementById('text-me').innerText = actionMsgs[userLang];
            document.getElementById('text-client').innerText = "...";
            document.getElementById('save-phrase-btn').classList.remove('active');
        }

        function setLang(lang, name) {
            targetLang = lang;
            document.getElementById('label-client').innerText = name.toUpperCase();
            document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
            stopConversation();
        }

        function killSpeechEngine() {
            clearTimeout(hardwareWatchdogTimer);
            if (recognition) {
                try {
                    recognition.onstart = null;
                    recognition.onresult = null;
                    recognition.onerror = null;
                    recognition.onend = null;
                    recognition.abort();
                } catch(e){}
                recognition = null;
            }
        }

        function createFreshRecognition() {
            const SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechEngine) return null;

            killSpeechEngine();

            const rec = new SpeechEngine();
            rec.continuous = false;
            rec.interimResults = true; 

            rec.onstart = () => { 
                clearTimeout(hardwareWatchdogTimer); 
            };

            rec.onresult = (event) => {
                clearTimeout(hardwareWatchdogTimer);

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentDisplay = currentTurn === 'me' ? document.getElementById('text-me') : document.getElementById('text-client');
                
                if (finalTranscript) {
                    processFinalText(finalTranscript);
                } else if (interimTranscript) {
                    currentDisplay.innerHTML = `<span class="interim">${interimTranscript}</span>`;
                    hardwareWatchdogTimer = setTimeout(() => { 
                        try { rec.stop(); } catch(e){} 
                    }, 3500);
                }
            };

            rec.onerror = (e) => {
                clearTimeout(hardwareWatchdogTimer);
                if (!isRunning || isSpeakingNow) return;
                handleErrorAndReset();
            };

            rec.onend = () => { 
                clearTimeout(hardwareWatchdogTimer); 
            };

            return rec;
        }

        function handleCentralButton(event) {
            event.stopPropagation();
            if (isRunning) {
                stopConversation();
            } else {
                startTurn('me');
            }
        }

        function startTurnFromArea(turn) {
            if (isSpeakingNow) return;
            startTurn(turn);
        }

        function startTurn(turn) {
            if (isSpeakingNow) return;
            
            killSpeechEngine();
            isRunning = true;
            currentTurn = turn;
            updateUI();

            document.getElementById('save-phrase-btn').classList.remove('active');

            const currentDisplay = currentTurn === 'me' ? document.getElementById('text-me') : document.getElementById('text-client');
            currentDisplay.innerHTML = `<span class="interim">🎤 ...</span>`;

            recognition = createFreshRecognition();
            if (!recognition) {
                alert("El navegador no soporta reconocimiento de voz.");
                returnToIdleState();
                return;
            }

            recognition.lang = currentTurn === 'me' ? langCodes[userLang] : langCodes[targetLang];

            try {
                recognition.start();
            } catch (e) {
                setTimeout(() => { 
                    try { if(recognition) recognition.start(); } catch(err) {}
                }, 200);
            }
        }

        function updateUI() {
            const container = document.getElementById('control-zone');
            if (!isRunning || currentTurn === 'idle' || isSpeakingNow) { 
                container.className = 'controls'; 
                return; 
            }
            container.className = currentTurn === 'me' ? 'controls pos-me mode-me' : 'controls pos-client mode-client';
        }

        function protectProperNouns(text) {
            const localTerms = ["Mahón", "Menorca", "Ciutadella", "Alaior", "Fornells", "Sánchez", "Dr."];
            let words = text.split(' ');
            return words.map(word => {
                if (localTerms.some(t => t.toLowerCase() === word.toLowerCase())) return word; 
                return word;
            }).join(' ');
        }

        function internalEngineFilter(text) {
            let processed = text.trim();
            if (processed.length < 2) return "";

            if (/^(si|sí|ok|vale|yes|oui|ja)$/i.test(processed)) processed = "Sí, de acuerdo.";
            if (/^(no|non|nein)$/i.test(processed)) processed = "No, lo siento.";

            return processed.charAt(0).toUpperCase() + processed.slice(1);
        }

        async function processFinalText(text) {
            if (!text) return;
            clearTimeout(hardwareWatchdogTimer);
            killSpeechEngine();
            
            let cleanText = protectProperNouns(text);
            cleanText = internalEngineFilter(cleanText);
            
            if (!cleanText) { handleErrorAndReset(); return; }

            const el = currentTurn === 'me' ? document.getElementById('text-me') : document.getElementById('text-client');
            el.innerText = cleanText;

            if (cleanText.toLowerCase().startsWith("nota")) {
                saveNote(cleanText);
            }

            try {
                const from = currentTurn === 'me' ? userLang : targetLang; 
                const to = currentTurn === 'me' ? targetLang : userLang;
                
                // Comprobación previa en el Diccionario Universal de Cortesía
                const lowerText = cleanText.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                if (courtesyDictionary[lowerText] && courtesyDictionary[lowerText][to]) {
                    const localTranslated = courtesyDictionary[lowerText][to];
                    
                    lastTranslationData = {
                        original: cleanText,
                        translated: localTranslated,
                        targetLang: to
                    };
                    document.getElementById('save-phrase-btn').classList.add('active');

                    if (currentTurn === 'me') {
                        document.getElementById('text-client').innerText = localTranslated;
                        speak(localTranslated, langCodes[targetLang], () => { returnToIdleState(); });
                    } else {
                        document.getElementById('text-me').innerText = localTranslated;
                        speak(localTranslated, langCodes[userLang], () => { returnToIdleState(); });
                    }
                    return;
                }

                // Traducción a través de API
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=${from}|${to}`);
                const data = await res.json();
                let translated = data.responseData.translatedText;

                translated = protectProperNouns(translated);
                translated = internalEngineFilter(translated);

                lastTranslationData = {
                    original: cleanText,
                    translated: translated,
                    targetLang: to
                };
                document.getElementById('save-phrase-btn').classList.add('active');

                if (currentTurn === 'me') {
                    document.getElementById('text-client').innerText = translated;
                    speak(translated, langCodes[targetLang], () => { returnToIdleState(); });
                } else {
                    document.getElementById('text-me').innerText = translated;
                    speak(translated, langCodes[userLang], () => { returnToIdleState(); });
                }
            } catch (e) { handleErrorAndReset(); }
        }

        function speak(text, lang, callback) {
            isSpeakingNow = true;
            clearTimeout(hardwareWatchdogTimer);
            killSpeechEngine();
            updateUI(); 

            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang; 
            u.rate = 0.90; 
            u.pitch = 1.0;
            
            u.onend = () => { isSpeakingNow = false; callback(); };
            u.onerror = () => { isSpeakingNow = false; callback(); };
            
            window.speechSynthesis.speak(u);
        }

        function handleErrorAndReset() {
            killSpeechEngine();
            const lang = currentTurn === 'me' ? userLang : targetLang;
            const el = currentTurn === 'me' ? document.getElementById('text-me') : document.getElementById('text-client');
            el.innerText = fallbackMsgs[lang];
            returnToIdleState();
        }

        function returnToIdleState() {
            isRunning = false;
            isSpeakingNow = false;
            currentTurn = 'idle';
            killSpeechEngine();
            updateUI();
        }

        function stopConversation() {
            returnToIdleState();
            window.speechSynthesis.cancel();
            resetToIdleMessage();
        }

        document.addEventListener("visibilitychange", () => { if (document.hidden) stopConversation(); });
    </script>
</body>
</html>
